<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Omada CRM">
<meta name="theme-color" content="#12213D">
<title>Omada Barber CRM</title>
<style>
  :root{
    --navy:#12213D; --navy-deep:#0B1729; --gold:#D98A15; --gold-dim:#B97F22;
    --cream:#FFFDF8; --paper:#F1EADA; --red:#B23A32; --red-bg:#F7E3E1;
    --green:#2E7A4F; --green-bg:#E4F1E9; --amber:#C08A1E; --amber-bg:#FBEFD9;
    --line:rgba(18,33,61,0.15); --text:#1A1A1A; --scale:1.35;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;min-height:100vh;padding-bottom:96px;}
  .stripe{height:6px;background:repeating-linear-gradient(90deg,var(--red) 0 24px,var(--cream) 24px 48px,var(--navy) 48px 72px);}
  header{padding:18px 18px 14px;background:var(--navy);display:flex;justify-content:space-between;align-items:center;}
  header .brand{font-size:calc(13px * var(--scale));letter-spacing:0.12em;text-transform:uppercase;color:var(--gold);font-weight:800;}
  header .sub{font-size:calc(11px * var(--scale));color:rgba(255,255,255,0.6);margin-top:2px;}
  main{padding:16px 14px 4px;max-width:640px;margin:0 auto;}

  .card{background:var(--cream);border:1px solid var(--line);box-shadow:0 2px 10px rgba(18,33,61,0.06);border-radius:16px;padding:16px;margin-bottom:14px;}
  label{display:block;font-size:calc(11px * var(--scale));letter-spacing:0.08em;text-transform:uppercase;color:var(--gold-dim);font-weight:800;margin-bottom:6px;}
  .field-row{display:flex;gap:8px;margin-bottom:14px;}
  .field-row input{flex:1;min-width:0;background:#fff;border:2px solid var(--navy);color:var(--text);font-size:calc(16px * var(--scale));font-weight:600;padding:11px 12px;border-radius:10px;}
  .mic-btn{flex-shrink:0;width:44px;border-radius:10px;border:2px solid var(--navy);background:var(--navy);color:var(--cream);font-size:calc(18px * var(--scale));}
  .mic-btn.listening{background:var(--red);border-color:var(--red);}
  textarea{width:100%;background:#fff;border:2px solid var(--navy);color:var(--text);font-size:calc(14px * var(--scale));padding:10px 12px;border-radius:10px;font-family:inherit;resize:vertical;min-height:60px;margin-bottom:14px;}
  .owner-row{display:flex;gap:8px;margin-bottom:14px;}
  .owner-btn{flex:1;padding:12px 0;border-radius:10px;border:2px solid var(--navy);background:#fff;color:var(--navy);font-size:calc(14px * var(--scale));font-weight:800;}
  .owner-btn.yes.selected{background:var(--green);border-color:var(--green);color:#fff;}
  .owner-btn.no.selected{background:var(--red);border-color:var(--red);color:#fff;}
  .owner-btn.unsure.selected{background:var(--amber);border-color:var(--amber);color:#fff;}
  .photo-box{margin-bottom:14px;}
  .photo-empty-row{display:flex;gap:8px;}
  .photo-choice{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:2px dashed var(--navy);border-radius:12px;padding:16px 6px;color:var(--navy);font-weight:800;font-size:calc(11px * var(--scale));background:#fff;text-align:center;}
  .photo-icon{font-size:calc(22px * var(--scale));}
  .photo-preview{position:relative;border-radius:12px;overflow:hidden;border:2px solid var(--navy);}
  .photo-preview img{display:block;width:100%;max-height:180px;object-fit:cover;}
  .photo-remove{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:999px;border:none;background:rgba(18,33,61,0.75);color:#fff;font-size:15px;font-weight:800;}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 14px;border-radius:10px;border:none;font-size:calc(13px * var(--scale));font-weight:800;letter-spacing:0.02em;cursor:pointer;}
  .btn-block{width:100%;}
  .btn-gold{background:var(--gold);color:#fff;}
  .btn-navy{background:var(--navy);color:#fff;}
  .btn-green{background:var(--green);color:#fff;}
  .btn-red{background:#fff;border:2px solid var(--red);color:var(--red);}
  .btn-outline{background:#fff;border:2px solid var(--navy);color:var(--navy);}
  .btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
  .btn-row .btn{flex:1;min-width:100px;}
  .link-btn{text-decoration:none;}

  .tabs{position:fixed;bottom:0;left:0;right:0;background:var(--navy);border-top:1px solid rgba(255,255,255,0.1);display:flex;z-index:50;}
  .tab-btn{flex:1;padding:10px 2px 12px;text-align:center;background:none;border:none;color:rgba(255,255,255,0.55);font-size:calc(10px * var(--scale));font-weight:800;letter-spacing:0.02em;position:relative;}
  .tab-btn.active{color:var(--gold);}
  .tab-btn .ico{display:block;font-size:calc(17px * var(--scale));margin-bottom:2px;}
  .tab-badge{position:absolute;top:2px;right:18%;background:var(--red);color:#fff;border-radius:999px;font-size:10px;min-width:16px;height:16px;padding:0 3px;display:flex;align-items:center;justify-content:center;font-weight:800;}

  .section-title{font-size:calc(12px * var(--scale));letter-spacing:0.1em;text-transform:uppercase;color:#fff;background:var(--navy);display:inline-block;padding:5px 12px;border-radius:999px;margin:0 0 10px 2px;font-weight:800;}
  .section-title.urgent{background:var(--red);}

  .queue-item{background:var(--cream);border-left:8px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;box-shadow:0 1px 6px rgba(18,33,61,0.05);}
  .queue-item.red{border-left-color:var(--red);}
  .queue-item.amber{border-left-color:var(--amber);}
  .queue-item.green{border-left-color:var(--green);}
  .qi-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .qi-name{font-size:calc(15px * var(--scale));font-weight:800;margin:0;}
  .qi-shop{color:var(--gold-dim);font-size:calc(12px * var(--scale));font-weight:700;}
  .qi-task{font-size:calc(12px * var(--scale));color:var(--text);margin-top:4px;font-weight:600;}
  .tag{font-size:calc(10px * var(--scale));font-weight:800;text-transform:uppercase;padding:3px 9px;border-radius:999px;white-space:nowrap;}
  .tag.red{background:var(--red-bg);color:var(--red);}
  .tag.amber{background:var(--amber-bg);color:var(--amber);}
  .tag.green{background:var(--green-bg);color:var(--green);}

  .stage-badge{display:inline-block;font-size:calc(10px * var(--scale));font-weight:800;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:var(--navy);color:#fff;margin-top:4px;}
  .empty{text-align:center;color:rgba(26,26,26,0.45);padding:30px 10px;font-size:calc(13px * var(--scale));}
  .empty .big{font-size:calc(30px * var(--scale));margin-bottom:6px;}
  .count-note{color:rgba(26,26,26,0.5);font-size:calc(11px * var(--scale));margin:0 0 12px 2px;}

  .archive-section h3{font-size:calc(13px * var(--scale));color:var(--navy);margin:18px 0 8px;}
  .archive-row{background:var(--cream);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .archive-row .name{font-weight:700;font-size:calc(13px * var(--scale));}
  .archive-row .meta{font-size:calc(11px * var(--scale));color:rgba(26,26,26,0.55);}

  .toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--navy);color:var(--cream);padding:10px 20px;border-radius:999px;font-weight:700;font-size:calc(13px * var(--scale));opacity:0;pointer-events:none;transition:opacity 0.25s;z-index:60;}
  .toast.show{opacity:1;}
  .lightbox{position:fixed;inset:0;background:rgba(11,23,41,0.92);display:none;align-items:center;justify-content:center;z-index:70;padding:24px;}
  .lightbox.show{display:flex;}
  .lightbox img{max-width:100%;max-height:100%;border-radius:14px;}
  .lightbox-close{position:absolute;top:20px;right:20px;width:40px;height:40px;border-radius:999px;border:none;background:rgba(255,255,255,0.15);color:#fff;font-size:20px;font-weight:800;}
  .nav-strip{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .icon-btn{background:var(--navy);border:none;border-radius:10px;width:42px;height:42px;font-size:calc(16px * var(--scale));font-weight:800;color:#fff;}
  .checkbox-row{display:flex;align-items:center;gap:8px;margin-bottom:14px;}
  .checkbox-row input{width:22px;height:22px;accent-color:var(--gold);}
  .checkbox-row span{font-size:calc(12px * var(--scale));font-weight:700;color:var(--navy);}
</style>
</head>
<body>

<div class="stripe"></div>
<header>
  <div>
    <div class="brand">Omada Barber CRM</div>
    <div class="sub" id="headerSub">—</div>
  </div>
</header>

<main id="viewport"></main>

<div class="toast" id="toast">Saved</div>
<div class="lightbox" id="lightbox"><button class="lightbox-close" id="lightboxClose">✕</button><img id="lightboxImg" alt="Sign photo"></div>

<div class="tabs">
  <button class="tab-btn" data-tab="today"><span class="ico">📋</span>Do Today<span class="tab-badge" id="badgeToday" style="display:none">0</span></button>
  <button class="tab-btn" data-tab="add"><span class="ico">➕</span>Add</button>
  <button class="tab-btn" data-tab="pipeline"><span class="ico">🧭</span>Pipeline</button>
  <button class="tab-btn" data-tab="trials"><span class="ico">⏳</span>Trials</button>
  <button class="tab-btn" data-tab="history"><span class="ico">🗂️</span>History</button>
</div>

<script>
// ---------- Storage ----------
const STORE_KEY = 'omada_prospects_v1';
function loadAll(){ try{ return JSON.parse(localStorage.getItem(STORE_KEY) || '[]'); }catch(e){ return []; } }
function saveAll(arr){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(arr)); }catch(e){ showToast('Save failed — storage full?'); } }

let prospects = loadAll();
let state = { tab: 'today', draftIndex: 0, editingId: null };

const HOUR = 3600000, DAY = 86400000;
const MSG = {
  intro: n => `Hey ${n||'there'}, it's Al with Omada — here's that video I mentioned, check it out when you get a sec:`,
  followup: n => `Hey ${n||'there'}, following up — did you get a chance to see that video?`,
  final: n => `Hey ${n||'there'}, last check-in from me — happy to swing back by if you want to see what Omada could do for your shop.`,
};

function uid(){ return 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function now(){ return Date.now(); }
function fmtDT(ts){ if(!ts) return ''; return new Date(ts).toLocaleDateString(undefined,{month:'short',day:'numeric'}); }
function esc(s){ const d=document.createElement('div'); d.textContent = s||''; return d.innerHTML; }
function formatPhone(raw){ const d=(raw||'').replace(/\D/g,'').slice(0,10); if(d.length<4) return d?`(${d}`:''; if(d.length<7) return `(${d.slice(0,3)}) ${d.slice(3)}`; return `(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}`; }
function digitsOnly(raw){ return (raw||'').replace(/\D/g,''); }
function persist(){ saveAll(prospects); }

function newBlank(){
  return {
    id: uid(), createdAt: now(), shopName:'', barberName:'', phone:'', address:'', notes:'', email:'',
    owner:null, platform:'', photo:null, demoDone:false,
    stage:'new', // new | interested | trial | converted | canceled | declined | dropped
    introSentAt:null, followUpSentAt:null, finalSentAt:null,
    trialStartAt:null, trialEndAt:null, lastTouchAt:now(),
  };
}

// ---------- Task / urgency logic ----------
function getTask(p){
  const t = now();
  if(p.stage === 'new'){
    if(!p.introSentAt){
      const hrs = (t - p.createdAt)/HOUR;
      if(hrs >= 24) return {type:'intro', level:'red', label:'Send intro video text — overdue'};
      if(hrs >= 12) return {type:'intro', level:'amber', label:'Send intro video text — due soon'};
      return {type:'intro', level:'green', label:'Send intro video text'};
    }
    if(!p.followUpSentAt){
      const hrs = (t - p.introSentAt)/HOUR;
      return hrs >= 48 ? {type:'followup', level:'red', label:'Send 48-hour follow-up text'} : {type:'followup-wait', level:'green', label:'On track — follow-up not due yet'};
    }
    if(!p.finalSentAt){
      const days = (t - p.followUpSentAt)/DAY;
      return days >= 3 ? {type:'final', level:'red', label:'Send final text'} : {type:'final-wait', level:'green', label:'On track — final text not due yet'};
    }
    const daysSinceFinal = (t - p.finalSentAt)/DAY;
    if(daysSinceFinal >= 7) return {type:'archive-now', level:'red', label:'No response 7 days after final text'};
    return {type:'final-sent-wait', level:'green', label:'Final text sent — waiting to hear back'};
  }
  if(p.stage === 'interested'){
    const days = (t - (p.lastTouchAt||p.createdAt))/DAY;
    return days >= 3 ? {type:'checkin', level:'red', label:'No contact in 3+ days — check in'} : {type:'ok', level:'green', label:'On track'};
  }
  if(p.stage === 'trial'){
    if(p.trialEndAt && t >= p.trialEndAt) return {type:'trial-outcome', level:'red', label:'7-day trial ended — mark outcome'};
    const daysLeft = Math.ceil((p.trialEndAt - t)/DAY);
    return {type:'trial-wait', level:'green', label:`Day ${7-daysLeft} of 7 — trial in progress`};
  }
  return {type:'none', level:'green', label:''};
}

function sweepAutoDrop(){
  let changed = false;
  prospects.forEach(p=>{
    if(p.stage === 'new' && getTask(p).type === 'archive-now'){
      p.stage = 'dropped'; p.droppedAt = now(); changed = true;
    }
  });
  if(changed) persist();
}

// ---------- Render shell ----------
function render(){
  sweepAutoDrop();
  const introQueue = prospects.filter(p=>p.stage==='new' && !p.introSentAt);
  const q48 = prospects.filter(p=>p.stage==='new' && p.introSentAt && !p.followUpSentAt);
  const q5day = prospects.filter(p=>p.stage==='new' && p.followUpSentAt && !p.finalSentAt);
  const qWaiting = prospects.filter(p=>p.stage==='new' && p.finalSentAt);
  const qOther = prospects.filter(p=>(p.stage==='interested' || p.stage==='trial') && getTask(p).level==='red');
  const dueCount = [introQueue,q48,q5day].reduce((n,list)=>n+list.filter(p=>getTask(p).level==='red').length,0) + qOther.length;

  document.getElementById('headerSub').textContent = dueCount > 0 ? `${dueCount} thing${dueCount===1?'':'s'} need attention` : 'All caught up';
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===state.tab));
  const badge = document.getElementById('badgeToday');
  if(dueCount>0){ badge.style.display='flex'; badge.textContent = dueCount; } else { badge.style.display='none'; }

  const vp = document.getElementById('viewport');
  if(state.tab==='today') renderToday(vp, introQueue, q48, q5day, qWaiting, qOther);
  else if(state.tab==='add') renderAdd(vp);
  else if(state.tab==='pipeline') renderPipeline(vp);
  else if(state.tab==='trials') renderTrials(vp);
  else renderHistory(vp);
}
document.querySelectorAll('.tab-btn').forEach(b=>b.addEventListener('click', ()=>{ state.tab=b.dataset.tab; state.editingId=null; render(); }));

// ---------- Do Today ----------
function renderToday(vp, introQueue, q48, q5day, qWaiting, qOther){
  let html = '';
  html += `<div class="section-title urgent">Intro Texts (${introQueue.length})</div>`;
  html += introQueue.length ? introQueue.map(p=>queueCard(p, getTask(p))).join('') :
    `<div class="empty" style="padding:14px;">Nobody waiting on an intro text.</div>`;

  html += `<div style="height:6px;"></div><div class="section-title urgent">48 Hour Texts (${q48.length})</div>`;
  html += q48.length ? q48.map(p=>queueCard(p, getTask(p))).join('') :
    `<div class="empty" style="padding:14px;">Nobody waiting on a 48-hour text.</div>`;

  html += `<div style="height:6px;"></div><div class="section-title urgent">5 Day Texts (${q5day.length})</div>`;
  html += q5day.length ? q5day.map(p=>queueCard(p, getTask(p))).join('') :
    `<div class="empty" style="padding:14px;">Nobody waiting on a final text.</div>`;

  if(qWaiting.length){
    html += `<div style="height:6px;"></div><div class="section-title">Waiting to Hear Back (${qWaiting.length})</div>`;
    html += qWaiting.map(p=>queueCard(p, getTask(p))).join('');
  }

  if(qOther.length){
    html += `<div style="height:6px;"></div><div class="section-title urgent">Check-Ins Due (${qOther.length})</div>`;
    html += qOther.map(p=>queueCard(p, getTask(p))).join('');
  }

  vp.innerHTML = html;
  wireQueueEvents();
}

function queueCard(p, task){
  const digits = digitsOnly(p.phone);
  const msgKey = task.type==='intro'?'intro':(task.type==='followup'?'followup':(task.type==='final'?'final':'intro'));
  const body = encodeURIComponent(MSG[msgKey](p.barberName));
  const showText = digits.length===10 && ['intro','followup','final'].includes(task.type);
  const showTrialButtons = task.type === 'trial-outcome';
  return `
    <div class="queue-item ${task.level}" data-id="${p.id}">
      <div class="qi-top">
        <div>
          <p class="qi-name">${esc(p.barberName)||'(no name)'}</p>
          <div class="qi-shop">${esc(p.shopName)||''}</div>
        </div>
        <span class="tag ${task.level}">${task.level==='red'?'Overdue':task.level==='amber'?'Due Soon':'On Track'}</span>
      </div>
      <div class="qi-task">${task.label}</div>
      <div class="btn-row">
        ${showText ? `<a class="btn btn-navy link-btn" href="sms:${digits}?&body=${body}">💬 Text</a>` : ''}
        ${p.address ? `<a class="btn btn-outline link-btn" href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(p.address)}" target="_blank" rel="noopener">📍 Directions</a>` : ''}
        ${['intro','followup','final'].includes(task.type) ? `<button class="btn btn-gold" data-mark="${task.type}">✓ Mark Sent</button>` : ''}
        ${task.type==='checkin' ? `<button class="btn btn-gold" data-mark="checkin">✓ Logged Contact</button>` : ''}
        ${task.type==='archive-now' ? `<button class="btn btn-outline" data-mark="interested">Mark Interested</button>` : ''}
        ${showTrialButtons ? `<button class="btn btn-green" data-outcome="converted">✅ Converted</button><button class="btn btn-red" data-outcome="canceled">❌ Canceled</button>` : ''}
      </div>
    </div>`;
}

function wireQueueEvents(){
  document.querySelectorAll('[data-mark]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.closest('[data-id]').dataset.id;
      const p = prospects.find(x=>x.id===id);
      const type = btn.dataset.mark;
      if(type==='intro') p.introSentAt = now();
      if(type==='followup') p.followUpSentAt = now();
      if(type==='final') p.finalSentAt = now();
      if(type==='checkin') p.lastTouchAt = now();
      if(type==='interested') p.stage = 'interested';
      p.lastTouchAt = now();
      persist(); showToast('Updated'); render();
    });
  });
  document.querySelectorAll('[data-outcome]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.closest('[data-id]').dataset.id;
      const p = prospects.find(x=>x.id===id);
      p.stage = btn.dataset.outcome === 'converted' ? 'converted' : 'canceled';
      p.outcomeAt = now();
      persist(); showToast('Recorded'); render();
    });
  });
}

// ---------- Add / Edit ----------
function renderAdd(vp){
  const p = state.editingId ? prospects.find(x=>x.id===state.editingId) : newBlank();
  const editing = !!state.editingId;
  vp.innerHTML = `
    <div class="card">
      <label>Barber's Name</label>
      <div class="field-row"><input id="f-barber" value="${esc(p.barberName)}" placeholder="Tap mic or type"><button class="mic-btn" data-target="f-barber">🎙️</button></div>

      <label>Barbershop Name</label>
      <div class="field-row"><input id="f-shop" value="${esc(p.shopName)}" placeholder="Tap mic or type"><button class="mic-btn" data-target="f-shop">🎙️</button></div>

      <label>Phone Number</label>
      <div class="field-row"><input id="f-phone" type="tel" value="${esc(p.phone)}" placeholder="(xxx) xxx-xxxx"><button class="mic-btn" data-target="f-phone">🎙️</button></div>

      <label>Address</label>
      <div class="field-row"><input id="f-address" value="${esc(p.address)}" placeholder="Tap mic or type"><button class="mic-btn" data-target="f-address">🎙️</button></div>

      <label>Email <span style="text-transform:none;font-weight:600;color:rgba(26,26,26,0.5);">(add whenever — no rush on day 1)</span></label>
      <div class="field-row"><input id="f-email" type="email" value="${esc(p.email)}" placeholder="name@shop.com"><button class="mic-btn" data-target="f-email">🎙️</button></div>

      <label>Owner?</label>
      <div class="owner-row">
        <button class="owner-btn yes ${p.owner==='yes'?'selected':''}" id="ownerYes">YES</button>
        <button class="owner-btn no ${p.owner==='no'?'selected':''}" id="ownerNo">NO</button>
        <button class="owner-btn unsure ${p.owner==='unsure'?'selected':''}" id="ownerUnsure">NOT SURE</button>
      </div>

      <label>Notes</label>
      <textarea id="f-notes" placeholder="Uses Booksy, quoted the plan...">${esc(p.notes)}</textarea>

      <label>Photo of Sign</label>
      <div class="photo-box" id="photoBox">
        <input type="file" id="photoInput" accept="image/*" capture="environment" style="display:none">
        <input type="file" id="libraryInput" accept="image/*" style="display:none">
        <div class="photo-empty-row" id="photoEmpty" style="${p.photo?'display:none':''}">
          <div class="photo-choice" id="takePhotoBtn"><span class="photo-icon">📷</span><span>TAKE PHOTO</span></div>
          <div class="photo-choice" id="chooseLibraryBtn"><span class="photo-icon">🖼️</span><span>FROM LIBRARY</span></div>
        </div>
        <div class="photo-preview" id="photoPreview" style="${p.photo?'':'display:none'}">
          <img id="photoImg" src="${p.photo||''}" alt="Sign photo">
          <button class="photo-remove" id="photoRemove">✕</button>
        </div>
      </div>

      <button class="btn btn-gold btn-block" id="saveBtn">${editing?'UPDATE PROSPECT':'SAVE PROSPECT'}</button>
      ${editing ? `<button class="btn btn-outline btn-block" style="margin-top:8px;" id="cancelEditBtn">Cancel Edit</button>` : ''}
    </div>
  `;

  let ownerVal = p.owner, photoDataUrl = p.photo;
  document.getElementById('ownerYes').onclick = ()=>{ ownerVal='yes'; refreshOwnerBtns(); };
  document.getElementById('ownerNo').onclick = ()=>{ ownerVal='no'; refreshOwnerBtns(); };
  document.getElementById('ownerUnsure').onclick = ()=>{ ownerVal='unsure'; refreshOwnerBtns(); };
  function refreshOwnerBtns(){
    document.getElementById('ownerYes').classList.toggle('selected', ownerVal==='yes');
    document.getElementById('ownerNo').classList.toggle('selected', ownerVal==='no');
    document.getElementById('ownerUnsure').classList.toggle('selected', ownerVal==='unsure');
  }
  document.getElementById('f-phone').addEventListener('input', e=>{ e.target.value = formatPhone(e.target.value); });

  const photoInput = document.getElementById('photoInput'), libraryInput = document.getElementById('libraryInput');
  document.getElementById('takePhotoBtn').onclick = ()=>photoInput.click();
  document.getElementById('chooseLibraryBtn').onclick = ()=>libraryInput.click();
  function handlePhotoFile(file){
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ev=>{
      const img = new Image();
      img.onload = ()=>{
        const maxW = 800; const scale = Math.min(1, maxW/img.width);
        const c = document.createElement('canvas'); c.width = img.width*scale; c.height = img.height*scale;
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        photoDataUrl = c.toDataURL('image/jpeg',0.65);
        document.getElementById('photoImg').src = photoDataUrl;
        document.getElementById('photoEmpty').style.display='none';
        document.getElementById('photoPreview').style.display='block';
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  }
  photoInput.onchange = e=>handlePhotoFile(e.target.files[0]);
  libraryInput.onchange = e=>handlePhotoFile(e.target.files[0]);
  document.getElementById('photoRemove').onclick = ()=>{
    photoDataUrl = null; photoInput.value=''; libraryInput.value='';
    document.getElementById('photoPreview').style.display='none';
    document.getElementById('photoEmpty').style.display='flex';
  };

  document.querySelectorAll('.mic-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const target = document.getElementById(btn.dataset.target);
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if(!SR){ target.focus(); showToast('Voice not available — type instead'); return; }
      const rec = new SR(); rec.lang='en-US'; rec.interimResults=false;
      btn.classList.add('listening'); rec.start();
      rec.onresult = ev=>{ const t = ev.results[0][0].transcript; target.value = target.id==='f-phone' ? formatPhone(t) : t; };
      rec.onerror = ()=>showToast("Didn't catch that — try typing");
      rec.onend = ()=>btn.classList.remove('listening');
    });
  });

  document.getElementById('saveBtn').onclick = ()=>{
    const shopName = document.getElementById('f-shop').value.trim();
    const barberName = document.getElementById('f-barber').value.trim();
    const phone = document.getElementById('f-phone').value.trim();
    if(!shopName && !barberName && !phone){ showToast('Enter a name or number first'); return; }
    p.shopName = shopName; p.barberName = barberName; p.phone = phone;
    p.address = document.getElementById('f-address').value.trim();
    p.email = document.getElementById('f-email').value.trim();
    p.notes = document.getElementById('f-notes').value;
    p.owner = ownerVal; p.photo = photoDataUrl;
    if(!editing){ prospects.push(p); }
    persist();
    showToast(editing ? 'Updated ✓' : 'Saved ✓');
    state.editingId = null;
    render();
  };
  if(editing) document.getElementById('cancelEditBtn').onclick = ()=>{ state.editingId=null; render(); };
}

// ---------- Pipeline ----------
function renderPipeline(vp){
  const active = prospects.filter(p=>p.stage==='new' || p.stage==='interested');
  const order = {red:0, amber:1, green:2};
  active.sort((a,b)=> order[getTask(a).level]-order[getTask(b).level]);
  if(active.length===0){ vp.innerHTML = `<div class="empty"><div class="big">🧭</div>No active prospects yet.<br>Add one from the Add tab.</div>`; return; }
  vp.innerHTML = active.map(p=>{
    const task = getTask(p);
    const digits = digitsOnly(p.phone);
    return `
    <div class="queue-item ${task.level}" data-id="${p.id}">
      <div class="qi-top">
        <div>
          <p class="qi-name">${esc(p.barberName)||'(no name)'}</p>
          <div class="qi-shop">${esc(p.shopName)||''}</div>
          <span class="stage-badge">${p.stage==='new'?'New':'Interested'}</span>
          ${p.owner==='yes'?'<span class="tag green" style="margin-left:6px;">Owner</span>':''}
          ${p.owner==='unsure'?'<span class="tag amber" style="margin-left:6px;">Owner Not Sure</span>':''}
        </div>
        <span class="tag ${task.level}">${task.level==='red'?'Due':'On track'}</span>
      </div>
      <div class="qi-task">${task.label}</div>
      <label style="margin-top:10px;">Notes</label>
      <textarea data-notes>${esc(p.notes)}</textarea>
      <label>Email</label>
      <div class="field-row"><input type="email" data-email value="${esc(p.email)}" placeholder="name@shop.com"></div>
      <div class="checkbox-row"><input type="checkbox" data-demo ${p.demoDone?'checked':''}><span>Did a demo (for your own tracking)</span></div>
      <div class="btn-row">
        ${digits.length===10 ? `<a class="btn btn-navy link-btn" href="sms:${digits}?&body=">💬 Text</a>` : ''}
        ${p.address ? `<a class="btn btn-outline link-btn" href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(p.address)}" target="_blank" rel="noopener">📍 Directions</a>` : ''}
        <button class="btn btn-outline" data-edit>✏️ Edit</button>
      </div>
      <div class="btn-row">
        ${p.stage==='new' ? `<button class="btn btn-gold" data-stage="interested">Mark Interested</button>` : ''}
        ${p.stage==='interested' ? `<button class="btn btn-green" data-stage="trial">Start 7-Day Trial</button>` : ''}
        <button class="btn btn-red" data-stage="declined">Not Interested</button>
      </div>
    </div>`;
  }).join('');

  vp.querySelectorAll('.queue-item').forEach(el=>{
    const id = el.dataset.id; const p = prospects.find(x=>x.id===id);
    el.querySelector('[data-notes]').oninput = e=>{ p.notes = e.target.value; persist(); };
    el.querySelector('[data-email]').oninput = e=>{ p.email = e.target.value.trim(); persist(); };
    el.querySelector('[data-demo]').onchange = e=>{ p.demoDone = e.target.checked; persist(); };
    el.querySelector('[data-edit]').onclick = ()=>{ state.editingId = id; state.tab='add'; render(); };
    el.querySelectorAll('[data-stage]').forEach(btn=>{
      btn.onclick = ()=>{
        const s = btn.dataset.stage;
        if(s==='trial'){ p.stage='trial'; p.trialStartAt=now(); p.trialEndAt=now()+7*DAY; }
        else { p.stage = s; }
        p.lastTouchAt = now();
        persist(); showToast('Moved'); render();
      };
    });
  });
}

// ---------- Trials ----------
function renderTrials(vp){
  const trials = prospects.filter(p=>p.stage==='trial');
  if(trials.length===0){ vp.innerHTML = `<div class="empty"><div class="big">⏳</div>Nobody's in a free trial right now.</div>`; return; }
  vp.innerHTML = trials.map(p=>{
    const task = getTask(p);
    const daysLeft = Math.max(0, Math.ceil((p.trialEndAt-now())/DAY));
    return `
    <div class="queue-item ${task.level}" data-id="${p.id}">
      <div class="qi-top">
        <div><p class="qi-name">${esc(p.barberName)||'(no name)'}</p><div class="qi-shop">${esc(p.shopName)||''}</div></div>
        <span class="tag ${task.level}">${task.type==='trial-outcome' ? 'Ended' : daysLeft+' day'+(daysLeft===1?'':'s')+' left'}</span>
      </div>
      <label>Email</label>
      <div class="field-row"><input type="email" data-email value="${esc(p.email)}" placeholder="name@shop.com"></div>
      <div class="btn-row">
        <button class="btn btn-green" data-outcome="converted">✅ Converted</button>
        <button class="btn btn-red" data-outcome="canceled">❌ Canceled</button>
      </div>
    </div>`;
  }).join('');
  vp.querySelectorAll('[data-email]').forEach(inp=>{
    inp.oninput = e=>{
      const id = e.target.closest('[data-id]').dataset.id;
      const p = prospects.find(x=>x.id===id);
      p.email = e.target.value.trim(); persist();
    };
  });
  vp.querySelectorAll('[data-outcome]').forEach(btn=>{
    btn.onclick = ()=>{
      const id = btn.closest('[data-id]').dataset.id;
      const p = prospects.find(x=>x.id===id);
      p.stage = btn.dataset.outcome==='converted' ? 'converted' : 'canceled';
      p.outcomeAt = now();
      persist(); showToast('Recorded'); render();
    };
  });
}

// ---------- History ----------
function renderHistory(vp){
  const trialStarted = prospects.filter(p=>p.trialStartAt);
  const converted = prospects.filter(p=>p.stage==='converted');
  const canceled = prospects.filter(p=>p.stage==='canceled');
  const declined = prospects.filter(p=>p.stage==='declined');
  const dropped = prospects.filter(p=>p.stage==='dropped');

  const stageLabel = {new:'New', interested:'Interested', trial:'In Trial', converted:'Converted', canceled:'Trial Canceled', declined:'Not Interested', dropped:'Dropped'};

  function section(title, list){
    return `<div class="archive-section"><h3>${title} (${list.length})</h3>${
      list.length===0 ? `<div class="empty" style="padding:12px;">None yet.</div>` :
      list.map(p=>`
        <div class="archive-row">
          <div><div class="name">${esc(p.barberName)||'(no name)'}</div><div class="meta">${esc(p.shopName)||''} · ${esc(p.phone)||''} · ${stageLabel[p.stage]||p.stage}</div>${p.email?`<div class="meta">✉️ ${esc(p.email)}</div>`:''}</div>
          <button class="btn btn-outline" style="padding:8px 10px;" data-reengage="${p.id}">↺</button>
        </div>`).join('')
    }</div>`;
  }

  vp.innerHTML = `
    <button class="btn btn-navy btn-block" id="exportCsv">⬇ Export CSV</button>
    ${section('Agreed to Free Trial', trialStarted)}
    ${section('Converted to Customer', converted)}
    ${section('Trial Canceled', canceled)}
    ${section('Not Interested', declined)}
    ${section('No Response — Dropped', dropped)}
  `;
  vp.querySelectorAll('[data-reengage]').forEach(btn=>{
    btn.onclick = ()=>{
      const p = prospects.find(x=>x.id===btn.dataset.reengage);
      p.stage='interested'; p.lastTouchAt=now();
      persist(); state.tab='pipeline'; render();
    };
  });
  document.getElementById('exportCsv').onclick = ()=>{
    const headers = ['Barber','Shop','Phone','Email','Address','Owner','Notes','Stage','Created','Intro Sent','Follow-up Sent','Final Sent','Trial Start','Trial End','Outcome Date','Did Demo'];
    const rows = prospects.map(p=>[p.barberName,p.shopName,p.phone,p.email,p.address,p.owner,p.notes,p.stage,
      fmtDT(p.createdAt), fmtDT(p.introSentAt), fmtDT(p.followUpSentAt), fmtDT(p.finalSentAt),
      fmtDT(p.trialStartAt), fmtDT(p.trialEndAt), fmtDT(p.outcomeAt), p.demoDone?'Yes':'No']);
    const csv = [headers, ...rows].map(r=>r.map(v=>`"${String(v||'').replace(/"/g,'""')}"`).join(',')).join('\n');
    const blob = new Blob([csv], {type:'text/csv'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url; a.download=`omada-crm-${new Date().toISOString().slice(0,10)}.csv`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
  };
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1200);
}

document.getElementById('lightboxClose').onclick = ()=>document.getElementById('lightbox').classList.remove('show');

render();
setInterval(render, 60000); // re-check urgency every minute so red/green states update live
</script>
</body>
