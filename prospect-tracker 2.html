<title>Today's Visits</title>
<style>
  :root{
    --navy:#12213D;
    --navy-deep:#0B1729;
    --gold:#D98A15;
    --gold-dim:#B97F22;
    --cream:#FFFDF8;
    --paper:#F1EADA;
    --red:#B23A32;
    --green:#2E7A4F;
    --line:rgba(18,33,61,0.18);
    --text:#1A1A1A;
    --scale:1.6;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
    min-height:100vh;
    padding-bottom:40px;
  }
  .stripe{
    height:6px;
    background:repeating-linear-gradient(90deg,var(--red) 0 24px,var(--cream) 24px 48px,var(--navy) 48px 72px);
  }
  header{
    padding:22px 20px 16px;
    background:var(--navy);
    border-bottom:1px solid var(--line);
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
  }
  header .brand{
    font-size:calc(13px * var(--scale));
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--gold);
    font-weight:800;
    margin-bottom:6px;
  }
  header .date-title{
    font-size:calc(26px * var(--scale));
    font-weight:800;
    line-height:1.05;
    color:var(--cream);
  }
  .text-size-row{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:8px;
    padding:10px 20px;
    background:var(--navy);
    border-bottom:1px solid var(--line);
  }
  .text-size-row span{
    font-size:11px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:rgba(255,255,255,0.55);
    font-weight:700;
    margin-right:2px;
  }
  .size-btn{
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.3);
    color:var(--cream);
    font-weight:800;
    width:40px;
    height:36px;
    border-radius:9px;
  }
  .size-btn:active{background:rgba(255,255,255,0.2);}
  .size-btn.small{font-size:13px;}
  .size-btn.big{font-size:19px;}

  .day-nav{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .day-nav button{
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.3);
    color:var(--cream);
    font-size:calc(18px * var(--scale));
    width:38px;
    height:38px;
    border-radius:10px;
  }
  .day-nav button:active{background:rgba(255,255,255,0.18);}
  .count-pill{
    font-size:calc(12px * var(--scale));
    color:#FFFFFF;
    background:var(--navy-deep);
    font-weight:800;
    padding:3px 10px;
    border-radius:999px;
    align-self:flex-start;
  }

  main{padding:18px 16px 0;}

  .card{
    background:var(--cream);
    border:1px solid rgba(18,33,61,0.12);
    box-shadow:0 2px 10px rgba(18,33,61,0.06);
    border-radius:18px;
    padding:18px;
    margin-bottom:16px;
  }

  label{
    display:block;
    font-size:calc(12px * var(--scale));
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--gold-dim);
    font-weight:800;
    margin-bottom:8px;
  }

  .field-row{
    display:flex;
    gap:8px;
    margin-bottom:18px;
  }
  .field-row input{
    flex:1;
    min-width:0;
    background:#FFFFFF;
    border:2px solid var(--navy);
    color:var(--text);
    font-size:calc(19px * var(--scale));
    font-weight:600;
    padding:14px 14px;
    border-radius:12px;
  }
  .field-row input::placeholder{color:rgba(26,26,26,0.4);font-weight:400;}
  .mic-btn{
    flex-shrink:0;
    width:52px;
    height:52px;
    border-radius:12px;
    border:2px solid var(--navy);
    background:var(--navy);
    color:var(--cream);
    font-size:calc(22px * var(--scale));
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .mic-btn.listening{
    background:var(--red);
    border-color:var(--red);
    animation:pulse 1s infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(178,58,50,0.5);}
    70%{box-shadow:0 0 0 12px rgba(178,58,50,0);}
    100%{box-shadow:0 0 0 0 rgba(178,58,50,0);}
  }

  .owner-row{
    display:flex;
    gap:10px;
    margin-bottom:20px;
  }
  .owner-btn{
    flex:1;
    padding:16px 0;
    border-radius:12px;
    border:2px solid var(--navy);
    background:#FFFFFF;
    color:var(--navy);
    font-size:calc(17px * var(--scale));
    font-weight:800;
    letter-spacing:0.03em;
  }
  .owner-btn.yes.selected{background:var(--green);border-color:var(--green);color:#fff;}
  .owner-btn.no.selected{background:var(--red);border-color:var(--red);color:#fff;}

  .photo-box{
    margin-bottom:20px;
  }
  .photo-empty{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:6px;
    border:2px dashed var(--navy);
    border-radius:14px;
    padding:22px 0;
    color:var(--navy);
    font-weight:800;
    font-size:calc(13px * var(--scale));
    letter-spacing:0.05em;
    background:#FFFFFF;
  }
  .photo-icon{font-size:calc(28px * var(--scale));}
  .photo-preview{
    position:relative;
    border-radius:14px;
    overflow:hidden;
    border:2px solid var(--navy);
  }
  .photo-preview img{
    display:block;
    width:100%;
    max-height:220px;
    object-fit:cover;
  }
  .photo-remove{
    position:absolute;
    top:8px;
    right:8px;
    width:32px;
    height:32px;
    border-radius:999px;
    border:none;
    background:rgba(18,33,61,0.75);
    color:#fff;
    font-size:16px;
    font-weight:800;
  }

  .save-btn{
    width:100%;
    padding:18px 0;
    border:none;
    border-radius:14px;
    background:var(--gold);
    color:#fff;
    font-size:calc(18px * var(--scale));
    font-weight:800;
    letter-spacing:0.03em;
    box-shadow:0 2px 8px rgba(217,138,21,0.35);
  }
  .save-btn:active{background:var(--gold-dim);}
  .save-btn:disabled{opacity:0.4;}

  .entries{margin-top:4px;}
  .entries h2{
    display:inline-block;
    font-size:calc(13px * var(--scale));
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:#FFFFFF;
    background:var(--navy);
    padding:5px 12px;
    border-radius:999px;
    margin:0 0 10px 4px;
    font-weight:800;
  }
  .entry{
    background:var(--cream);
    border:1px solid rgba(18,33,61,0.12);
    box-shadow:0 1px 6px rgba(18,33,61,0.05);
    border-radius:14px;
    padding:14px 16px;
    margin-bottom:10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
  }
  .entry-thumb{
    width:52px;
    height:52px;
    border-radius:10px;
    object-fit:cover;
    border:2px solid var(--navy);
    flex-shrink:0;
  }
  .entry-main{
    display:flex;
    align-items:center;
    gap:12px;
    min-width:0;
  }
  .lightbox{
    position:fixed;
    inset:0;
    background:rgba(11,23,41,0.92);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:50;
    padding:24px;
  }
  .lightbox.show{display:flex;}
  .lightbox img{
    max-width:100%;
    max-height:100%;
    border-radius:14px;
  }
  .lightbox-close{
    position:absolute;
    top:20px;
    right:20px;
    width:40px;
    height:40px;
    border-radius:999px;
    border:none;
    background:rgba(255,255,255,0.15);
    color:#fff;
    font-size:20px;
    font-weight:800;
  }
  .entry .info .shop{font-size:calc(17px * var(--scale));font-weight:800;color:var(--navy);}
  .entry .info .barber{font-size:calc(14px * var(--scale));color:var(--gold-dim);font-weight:700;margin-top:1px;}
  .entry .info .phone{font-size:calc(14px * var(--scale));color:rgba(26,26,26,0.6);margin-top:2px;}
  .badge{
    font-size:calc(11px * var(--scale));
    font-weight:800;
    letter-spacing:0.05em;
    padding:5px 10px;
    border-radius:999px;
  }
  .badge.yes{background:rgba(46,122,79,0.14);color:var(--green);}
  .badge.no{background:rgba(178,58,50,0.14);color:var(--red);}
  .del-btn{
    background:none;
    border:none;
    color:rgba(26,26,26,0.35);
    font-size:calc(20px * var(--scale));
    padding:0 0 0 12px;
  }
  .empty{
    text-align:center;
    color:rgba(26,26,26,0.45);
    padding:30px 10px;
    font-size:calc(14px * var(--scale));
  }
  .toast{
    position:fixed;
    bottom:24px;
    left:50%;
    transform:translateX(-50%);
    background:var(--navy);
    color:var(--cream);
    padding:10px 20px;
    border-radius:999px;
    font-weight:700;
    font-size:calc(14px * var(--scale));
    opacity:0;
    pointer-events:none;
    transition:opacity 0.25s;
    box-shadow:0 4px 14px rgba(18,33,61,0.3);
  }
  .toast.show{opacity:1;}
</style>
</head>
<body>

<div class="stripe"></div>
<header>
  <div>
    <div class="brand">Today's Visits</div>
    <div class="date-title" id="dateTitle">—</div>
    <div class="count-pill" id="countPill">0 today</div>
  </div>
  <div class="day-nav">
    <button id="prevDay">‹</button>
    <button id="nextDay">›</button>
  </div>
</header>

<main>
  <div class="card">
    <label for="shopInput">Barber Shop Name</label>
    <div class="field-row">
      <input id="shopInput" type="text" placeholder="Tap mic or type" autocomplete="off">
      <button class="mic-btn" data-target="shopInput">🎙️</button>
    </div>

    <label for="barberInput">Barber's Name</label>
    <div class="field-row">
      <input id="barberInput" type="text" placeholder="Tap mic or type" autocomplete="off">
      <button class="mic-btn" data-target="barberInput">🎙️</button>
    </div>

    <label for="phoneInput">Text Number</label>
    <div class="field-row">
      <input id="phoneInput" type="tel" placeholder="Tap mic or type" autocomplete="off">
      <button class="mic-btn" data-target="phoneInput">🎙️</button>
    </div>

    <label>Owner?</label>
    <div class="owner-row">
      <button class="owner-btn yes" id="ownerYes">YES</button>
      <button class="owner-btn no" id="ownerNo">NO</button>
    </div>

    <label>Photo of Sign</label>
    <div class="photo-box" id="photoBox">
      <input type="file" id="photoInput" accept="image/*" capture="environment" style="display:none">
      <div class="photo-empty" id="photoEmpty">
        <span class="photo-icon">📷</span>
        <span>TAKE PHOTO</span>
      </div>
      <div class="photo-preview" id="photoPreview" style="display:none">
        <img id="photoImg" alt="Sign photo">
        <button class="photo-remove" id="photoRemove">✕</button>
      </div>
    </div>

    <button class="save-btn" id="saveBtn">SAVE PROSPECT</button>
  </div>

  <div class="entries">
    <h2 id="entriesHeading">Today's Visits</h2>
    <div id="entriesList"></div>
  </div>
</main>

<div class="toast" id="toast">Saved</div>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightboxClose">✕</button>
  <img id="lightboxImg" alt="Sign photo full size">
</div>

<script>
const dateTitle = document.getElementById('dateTitle');
const countPill = document.getElementById('countPill');
const entriesList = document.getElementById('entriesList');
const entriesHeading = document.getElementById('entriesHeading');
const shopInput = document.getElementById('shopInput');
const barberInput = document.getElementById('barberInput');
const phoneInput = document.getElementById('phoneInput');
const ownerYes = document.getElementById('ownerYes');
const ownerNo = document.getElementById('ownerNo');
const saveBtn = document.getElementById('saveBtn');
const toast = document.getElementById('toast');
const prevDayBtn = document.getElementById('prevDay');
const nextDayBtn = document.getElementById('nextDay');
const photoInput = document.getElementById('photoInput');
const photoBox = document.getElementById('photoBox');
const photoEmpty = document.getElementById('photoEmpty');
const photoPreview = document.getElementById('photoPreview');
const photoImg = document.getElementById('photoImg');
const photoRemove = document.getElementById('photoRemove');
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightboxImg');
const lightboxClose = document.getElementById('lightboxClose');

let ownerVal = null;
let currentOffset = 0; // 0 = today, -1 = yesterday, etc.
let photoDataUrl = null;

function fmtKey(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function fmtTitle(d, offset){
  const opts = {weekday:'short', month:'short', day:'numeric'};
  let label = d.toLocaleDateString('en-US', opts).toUpperCase();
  if(offset === 0) label += ' · TODAY';
  return label;
}
function dateForOffset(offset){
  const d = new Date();
  d.setDate(d.getDate() + offset);
  return d;
}

function showToast(msg){
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(()=>toast.classList.remove('show'), 1200);
}

async function getEntries(key){
  try{
    const raw = localStorage.getItem('visits:' + key);
    return raw ? JSON.parse(raw) : [];
  }catch(e){
    return [];
  }
}
async function saveEntries(key, arr){
  try{
    localStorage.setItem('visits:' + key, JSON.stringify(arr));
  }catch(e){
    showToast('Save failed — try again');
  }
}

function selectOwner(val){
  ownerVal = val;
  ownerYes.classList.toggle('selected', val === 'yes');
  ownerNo.classList.toggle('selected', val === 'no');
}
ownerYes.addEventListener('click', ()=>selectOwner('yes'));
ownerNo.addEventListener('click', ()=>selectOwner('no'));

function resetForm(){
  shopInput.value = '';
  barberInput.value = '';
  phoneInput.value = '';
  selectOwner(null);
  ownerYes.classList.remove('selected');
  ownerNo.classList.remove('selected');
  photoDataUrl = null;
  photoImg.src = '';
  photoInput.value = '';
  photoPreview.style.display = 'none';
  photoEmpty.style.display = 'flex';
}

async function renderDay(){
  const d = dateForOffset(currentOffset);
  const key = fmtKey(d);
  dateTitle.textContent = fmtTitle(d, currentOffset);
  entriesHeading.textContent = currentOffset === 0 ? "Today's Visits" : "Visits";
  nextDayBtn.disabled = currentOffset >= 0;
  nextDayBtn.style.opacity = currentOffset >= 0 ? 0.35 : 1;

  const entries = await getEntries(key);
  countPill.textContent = `${entries.length} ${currentOffset===0 ? 'today' : ''}`.trim();

  entriesList.innerHTML = '';
  if(entries.length === 0){
    entriesList.innerHTML = '<div class="empty">No visits logged for this day yet.</div>';
    return;
  }
  entries.slice().reverse().forEach((e, revIdx)=>{
    const idx = entries.length - 1 - revIdx;
    const row = document.createElement('div');
    row.className = 'entry';
    const thumbHtml = e.photo
      ? `<img class="entry-thumb" src="${e.photo}" data-idx="${idx}">`
      : '';
    row.innerHTML = `
      <div class="entry-main">
        ${thumbHtml}
        <div class="info">
          <div class="shop">${escapeHtml(e.shopName || '(no name)')}</div>
          ${e.barberName ? `<div class="barber">${escapeHtml(e.barberName)}</div>` : ''}
          <div class="phone">${escapeHtml(e.phone || '')}</div>
        </div>
      </div>
      <div style="display:flex;align-items:center;">
        <span class="badge ${e.owner === 'yes' ? 'yes' : 'no'}">${e.owner === 'yes' ? 'OWNER' : 'NOT OWNER'}</span>
        <button class="del-btn" data-idx="${idx}">✕</button>
      </div>
    `;
    entriesList.appendChild(row);
  });

  entriesList.querySelectorAll('.entry-thumb').forEach(img=>{
    img.addEventListener('click', ()=>{
      lightboxImg.src = img.src;
      lightbox.classList.add('show');
    });
  });

  entriesList.querySelectorAll('.del-btn').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const i = parseInt(btn.dataset.idx, 10);
      const arr = await getEntries(key);
      arr.splice(i,1);
      await saveEntries(key, arr);
      renderDay();
    });
  });
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

saveBtn.addEventListener('click', async ()=>{
  if(!shopInput.value.trim() && !phoneInput.value.trim()){
    showToast('Enter a name or number first');
    return;
  }
  const key = fmtKey(dateForOffset(currentOffset));
  const arr = await getEntries(key);
  arr.push({
    shopName: shopInput.value.trim(),
    barberName: barberInput.value.trim(),
    phone: phoneInput.value.trim(),
    owner: ownerVal,
    photo: photoDataUrl || null,
    ts: new Date().toISOString()
  });
  await saveEntries(key, arr);
  resetForm();
  showToast('Saved ✓');
  renderDay();
});

prevDayBtn.addEventListener('click', ()=>{ currentOffset -= 1; renderDay(); });
nextDayBtn.addEventListener('click', ()=>{ if(currentOffset < 0){ currentOffset += 1; renderDay(); } });

// Photo capture
photoEmpty.addEventListener('click', ()=> photoInput.click());
photoInput.addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    const img = new Image();
    img.onload = ()=>{
      // compress: cap width at 800px, JPEG quality 0.65, to keep local storage lean
      const maxW = 800;
      const scale = Math.min(1, maxW / img.width);
      const canvas = document.createElement('canvas');
      canvas.width = img.width * scale;
      canvas.height = img.height * scale;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      photoDataUrl = canvas.toDataURL('image/jpeg', 0.65);
      photoImg.src = photoDataUrl;
      photoEmpty.style.display = 'none';
      photoPreview.style.display = 'block';
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});
photoRemove.addEventListener('click', ()=>{
  photoDataUrl = null;
  photoInput.value = '';
  photoImg.src = '';
  photoPreview.style.display = 'none';
  photoEmpty.style.display = 'flex';
});

// Lightbox
lightboxClose.addEventListener('click', ()=> lightbox.classList.remove('show'));
lightbox.addEventListener('click', (e)=>{
  if(e.target === lightbox) lightbox.classList.remove('show');
});

// Voice input
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
document.querySelectorAll('.mic-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    const targetInput = document.getElementById(btn.dataset.target);
    if(!SpeechRecognition){
      targetInput.focus();
      showToast('Voice not available — type instead');
      return;
    }
    const rec = new SpeechRecognition();
    rec.lang = 'en-US';
    rec.interimResults = false;
    rec.maxAlternatives = 1;
    btn.classList.add('listening');
    rec.start();
    rec.onresult = (event)=>{
      const transcript = event.results[0][0].transcript;
      if(targetInput === phoneInput){
        targetInput.value = transcript.replace(/[^0-9]/g, '') || transcript;
      } else {
        targetInput.value = transcript;
      }
    };
    rec.onerror = ()=>{
      showToast('Didn\'t catch that — try typing');
    };
    rec.onend = ()=>{
      btn.classList.remove('listening');
    };
  });
});

// Text size is fixed at the largest comfortable setting
document.documentElement.style.setProperty('--scale', '1.6');

renderDay();
</script>
</body>
</html>
